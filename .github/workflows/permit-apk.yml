name: Permit Register APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'permit/android/**'
      - '.github/workflows/permit-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          if grep -q PENDING permit/android/app-url.txt; then echo "https://example.workers.dev" > permit/android/app-url.txt; echo "TEST=1" >> $GITHUB_ENV; fi
          bash permit/android/build-apk.sh
      - name: Commit APK
        if: env.TEST != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add permit/apk/PermitRegister.apk || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Permit Register APK [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
