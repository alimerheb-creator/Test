# Builds the iPhone/iPad app on a Mac whenever the game changes and commits it to ipa/SixthFront.ipa, next to
# apk/SixthFront.apk and exe/SixthFront.exe. The .ipa is unsigned: install it with Sideloadly or AltStore, which
# sign it with your Apple ID (see README.md, "iPhone and iPad app").
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [claude/battlefield-6-game-2iu72e]
    paths:
      - 'js/**'
      - 'css/**'
      - 'mods/**'
      - 'index.html'
      - 'android/fonts/**'
      - 'android/prepare-web.mjs'
      - 'android/AndroidManifest.xml'
      - 'package.json'
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # (the Intel Macs: the Apple-silicon pool kept running out of machines and cancelling the job unstarted)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          npm install --no-audit --no-fund
          brew install xcodegen
          xcodebuild -version
      - name: Build the app
        run: bash ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SixthFront-ipa
          path: ios/build/SixthFront.ipa
      - name: Commit it to ipa/SixthFront.ipa
        run: |
          git status --short
          mkdir -p ipa
          cp ios/build/SixthFront.ipa ipa/SixthFront.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipa/SixthFront.ipa
          git commit -m "iOS app $(node -p "require('./package.json').version") [ios-only] [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
      # a check that the game really starts in the app: run it on an iPhone simulator for a minute, log what the
      # game reports (its state and the first script error) and take a screenshot
      - name: Run it on an iPhone simulator
        continue-on-error: true
        run: |
          cd ios
          xcodebuild -project SixthFront.xcodeproj -scheme SixthFront -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet build
          DEV=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")).devices;const all=Object.entries(d).filter(([k])=>k.includes("iOS")).flatMap(([,v])=>v);const p=all.find((x)=>/^iPhone \d+( Pro)?$/.test(x.name))||all.find((x)=>x.name.startsWith("iPhone"));console.log(p.udid)')
          echo "simulator $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/sim/Build/Products/Release-iphonesimulator/SixthFront.app
          xcrun simctl launch --console-pty "$DEV" com.sixthfront.game > build/sim.log 2>&1 &
          sleep 70
          xcrun simctl io "$DEV" screenshot build/iphone.png
          grep "SixthFront:" build/sim.log || tail -40 build/sim.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator
          path: |
            ios/build/iphone.png
            ios/build/sim.log
