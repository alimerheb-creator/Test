# Builds the iPhone/iPad app on a Mac whenever the game changes and commits it to ipa/SixthFront.ipa, next to
# apk/SixthFront.apk and exe/SixthFront.exe. The .ipa is unsigned: install it with Sideloadly or AltStore, which
# sign it with your Apple ID (see README.md, "iPhone and iPad app").
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [claude/battlefield-6-game-2iu72e]
    paths:
      - 'js/**'
      - 'css/**'
      - 'mods/**'
      - 'index.html'
      - 'android/fonts/**'
      - 'android/prepare-web.mjs'
      - 'android/AndroidManifest.xml'
      - 'package.json'
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # (the Intel Macs: the Apple-silicon pool kept running out of machines and cancelling the job unstarted)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          npm install --no-audit --no-fund
          brew install xcodegen
          xcodebuild -version
      - name: Build the app
        run: bash ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SixthFront-ipa
          path: ios/build/SixthFront.ipa
      - name: Commit it to ipa/SixthFront.ipa
        run: |
          git status --short
          mkdir -p ipa
          cp ios/build/SixthFront.ipa ipa/SixthFront.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipa/SixthFront.ipa
          git commit -m "iOS app $(node -p "require('./package.json').version") [ios-only] [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
      # a check that the game really works in the app: run it on an iPhone and an iPad simulator, where it starts a
      # battle by itself (-sfTest), log what the game reports every 5 s (its state, sound, frame rate and the first
      # script error) and take screenshots; they go into ios/test/ next to the app
      - name: Run it on an iPhone and an iPad simulator
        continue-on-error: true
        run: |
          cd ios
          mkdir -p test
          xcodebuild -project SixthFront.xcodeproj -scheme SixthFront -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet build
          pick() { xcrun simctl list devices available -j | node -e 'const re=new RegExp(process.argv[1]);const d=JSON.parse(require("fs").readFileSync(0,"utf8")).devices;const all=Object.entries(d).filter(([k])=>k.includes("iOS")).flatMap(([,v])=>v);const p=all.find((x)=>re.test(x.name));console.log(p?p.udid:"")' "$1"; }
          for kind in iphone ipad; do
            if [ "$kind" = iphone ]; then DEV=$(pick '^iPhone \d+( Pro)?$'); else DEV=$(pick '^iPad (Pro|Air)'); fi
            [ -n "$DEV" ] || { echo "no $kind simulator"; continue; }
            echo "$kind simulator $DEV"
            xcrun simctl boot "$DEV"
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl install "$DEV" build/sim/Build/Products/Release-iphonesimulator/SixthFront.app
            xcrun simctl launch --console-pty "$DEV" com.sixthfront.game -sfTest > "test/$kind.log" 2>&1 &
            sleep 45
            xcrun simctl io "$DEV" screenshot --type=jpeg "test/$kind-1.jpg"
            sleep 50
            xcrun simctl io "$DEV" screenshot --type=jpeg "test/$kind-2.jpg"
            sleep 15
            grep "SixthFront:" "test/$kind.log" > "test/$kind-report.txt" || tail -40 "test/$kind.log" > "test/$kind-report.txt"
            cat "test/$kind-report.txt"
            xcrun simctl shutdown "$DEV" || true
          done
          rm -f test/*.log
      - name: Commit the test screenshots to ios/test/
        if: always()
        continue-on-error: true
        run: |
          [ -d ios/test ] || exit 0
          git add ios/test
          git diff --cached --quiet && exit 0
          git commit -m "iOS test screenshots $(node -p "require('./package.json').version") [ios-only] [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
