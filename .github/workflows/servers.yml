# Deploys the public game servers (server/) to Cloudflare Workers whenever they change, or by hand from the
# Actions tab. Needs the repository secret CLOUDFLARE_API_TOKEN (a Cloudflare API token made from the
# "Edit Cloudflare Workers" template); CLOUDFLARE_ACCOUNT_ID is only needed if the token reaches more than one
# account. The servers' address is printed at the end of the deploy step.
name: Game servers

on:
  workflow_dispatch:
  push:
    branches: [claude/battlefield-6-game-2iu72e]
    paths:
      - 'server/**'
      - '.github/workflows/servers.yml'

concurrency:
  group: servers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        working-directory: server
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN secret (Settings > Secrets and variables > Actions) to deploy the game servers."
            exit 0
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          fi
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Check the servers answer
        working-directory: server
        run: |
          [ -f deploy.log ] || exit 0
          URL=$(grep -oE 'https://sixthfront\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)
          echo "Servers: $URL"
          [ -n "$URL" ] || exit 0
          sleep 8
          curl -fsS "$URL/"; echo
          # a game over WebSockets: one page hosts, another joins and gets the host's state
          URL="$URL" node -e '
            const base = process.env.URL.replace(/^http/, "ws"), code = "QZQZ";
            const open = (p) => new Promise((res, rej) => { const ws = new WebSocket(base + p); const got = []; ws.onmessage = (e) => got.push(String(e.data)); ws.onopen = () => res({ ws, got }); ws.onerror = () => rej(new Error("no connection to " + p)); });
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              const h = await open("/v1/game/" + code + "?host=1"); await wait(800);
              if (!h.got[0] || h.got[0][0] !== "H") throw new Error("host: " + h.got.join(" | "));
              h.ws.send("m{\"r\":\"h\"}"); await wait(300);
              const c = await open("/v1/game/" + code); await wait(800);
              if (!c.got.some((m) => m.startsWith("Pm"))) throw new Error("join: " + c.got.join(" | "));
              const l = await open("/v1/lobby"); await wait(800);
              if (!l.got[0] || l.got[0][0] !== "H") throw new Error("lobby: " + l.got.join(" | "));
              console.log("WebSocket games and lobby: OK");
              process.exit(0);
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
