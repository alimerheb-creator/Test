name: Permit Register deploy

on:
  workflow_dispatch:
  push:
    paths:
      - 'permit/**'
      - '!permit/android/**'
      - '!permit/apk/**'
      - '.github/workflows/permit-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN secret not set yet"; exit 0; fi
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          echo "account: ${ACC:0:6}..."
          export CLOUDFLARE_ACCOUNT_ID="$ACC"
          cd permit
          npx --yes wrangler@4 deploy
