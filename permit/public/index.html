<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Permit Register</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f3a34">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --ink:#1c2321; --muted:#5f6b67; --line:#dfe3df;
  --brand:#1f3a34; --brand-2:#2c524a; --accent:#f2b705; --accent-ink:#2a2200;
  --ok:#1d7a4d; --ok-bg:#e3f3ea; --warn:#9a6400; --warn-bg:#fff3d6; --bad:#b3261e; --bad-bg:#fbe5e3;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 96px}
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
header.top .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;flex:none}
.brandname{font-weight:700;line-height:1.1}
.brandname small{display:block;font-weight:400;opacity:.75;font-size:12px}
.spacer{flex:1}
.chip-user{display:flex;align-items:center;gap:8px;font-size:13px;text-align:right;line-height:1.2}
.chip-user small{display:block;opacity:.75}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:#e7ebe8;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:12px}
.btn.onDark{background:rgba(255,255,255,.12);color:#fff}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat .v{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hl{background:var(--brand);color:#fff}
.stat.hl .l{color:rgba(255,255,255,.75)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.in-f{width:100%;padding:11px 12px;border:1px solid #c9d0cc;border-radius:10px;background:#fff;min-height:44px}
.in-f:focus{outline:2px solid var(--accent);border-color:transparent}
textarea.in-f{min-height:80px;resize:vertical}
.pinbox{letter-spacing:.4em;font-size:20px;text-align:center}
.tabs{display:flex;gap:6px;background:#e6eae7;padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20}
nav.bottom .in{max-width:980px;margin:0 auto;display:flex}
nav.bottom button{flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brand)}
nav.bottom button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nbadge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.st-issued{background:var(--ok-bg);color:var(--ok)}
.st-awaiting_photo{background:var(--warn-bg);color:var(--warn)}
.st-cancelled{background:var(--bad-bg);color:var(--bad)}
.st-pending{background:var(--warn-bg);color:var(--warn)}
.st-approved{background:var(--ok-bg);color:var(--ok)}
.st-suspended,.st-rejected{background:var(--bad-bg);color:var(--bad)}
.plist{display:grid;gap:10px}
.pcard{display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;border:0;text-align:left;cursor:pointer;width:100%}
.thumb{width:76px;height:76px;border-radius:9px;background:#e8ece9;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:#9aa5a0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.xmark{position:absolute;inset:0;pointer-events:none}
.xmark::before,.xmark::after{content:"";position:absolute;left:50%;top:50%;width:140%;height:6px;background:rgba(179,38,30,.85);transform-origin:center}
.xmark::before{transform:translate(-50%,-50%) rotate(45deg)}
.xmark::after{transform:translate(-50%,-50%) rotate(-45deg)}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.wm span{transform:rotate(-28deg);border:5px solid rgba(179,38,30,.9);color:rgba(179,38,30,.9);font-weight:800;font-size:clamp(28px,9vw,64px);padding:4px 18px;border-radius:10px;letter-spacing:.08em;background:rgba(255,255,255,.35)}
.pmeta{flex:1;min-width:0}
.pmeta .serial{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px}
.pmeta .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#e9ede9;border:1px solid var(--line);user-select:none}
.plan-img{display:block;width:100%;height:auto}
.plan-empty{aspect-ratio:16/10;background-color:#eef1ee;background-image:linear-gradient(#d9dfdb 1px,transparent 1px),linear-gradient(90deg,#d9dfdb 1px,transparent 1px);background-size:40px 40px}
.plan-ph{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px}
.plan.placing{cursor:crosshair;outline:3px dashed var(--accent)}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:var(--brand);color:#fff;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.pin:hover{background:var(--brand-2)}
.pin-active{background:var(--accent);color:var(--accent-ink)}
.pin-badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;font-size:11px;line-height:17px}
 .sitemap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sitemap svg{display:block;width:100%;min-width:820px;height:auto}
.sitemap .rd{fill:#c0392b;font:700 17px "IBM Plex Sans",sans-serif}
.sitemap .seg{cursor:pointer}
.sitemap .seg rect,.sitemap .seg path{fill:#d6efe6;stroke:#1f9a74;stroke-width:3}
.sitemap .seg.hot rect,.sitemap .seg.hot path{fill:#ffe48a;stroke:#c99400}
.sitemap .seg.off{opacity:.45}
.sitemap .seg:hover rect,.sitemap .seg:hover path{fill:#bfe6d6}
.sitemap .lb{font:600 17px "IBM Plex Mono",monospace;fill:#1c2321}
.sitemap .ct{font:700 14px "IBM Plex Sans",sans-serif;fill:#9a6400}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.atile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;border:0;text-align:left;cursor:pointer}
.atile .c{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:18px}
.atile .n{font-size:13px;color:var(--muted);min-height:18px}
.atile .k{font-size:12px;margin-top:6px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:none;padding:0;min-width:0}
.bar .b{width:100%;max-width:34px;background:var(--brand-2);border-radius:4px 4px 0 0;min-height:2px}
.bar.sel .b{background:var(--accent)}
.bar .v{font-size:11px;font-weight:700;margin-bottom:3px}
.bar .d{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.listrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listrow:last-child{border-bottom:0}
.listrow .grow{flex:1;min-width:160px}
.modal{position:fixed;inset:0;background:rgba(15,22,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{margin:0;flex:1}
.x{border:0;background:#eef1ee;border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer}
.bigserial{font-family:"IBM Plex Mono",monospace;font-size:clamp(34px,10vw,52px);font-weight:600;text-align:center;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 8px;margin:6px 0 12px}
.photo{position:relative;border-radius:12px;overflow:hidden;background:#e8ece9;min-height:120px}
.photo img{display:block;width:100%;height:auto}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin:12px 0}
.kv div:nth-child(odd){color:var(--muted)}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:#5a3d00;margin-bottom:14px;font-size:14px}
.notice.bad{background:var(--bad-bg);color:#6d1712}
.notice.ok{background:var(--ok-bg);color:#0f4a2d}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1c2321;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.auth{max-width:420px;margin:0 auto;padding:28px 16px}
.auth .hero{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.auth .hero .logo{width:48px;height:48px;font-size:20px;border-radius:12px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.back{border:0;background:none;color:var(--brand);font-weight:600;padding:0;margin-bottom:8px;cursor:pointer}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.filters .in-f{min-height:40px;padding:8px 10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const TZ = "Asia/Riyadh";
const $ = s => document.querySelector(s);
function el(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "svg") e.innerHTML = v; // static, trusted icon markup only
    else if (["value","checked","disabled","type","placeholder","inputMode","maxLength","src","alt","id","title","multiple","rows"].includes(k)) e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  if (tag === "select" && props && "value" in props) e.value = props.value ?? "";
  return e;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const normName = s => String(s||"").trim().replace(/\s+/g," ").toLowerCase();
const dayKey = d => new Date(d).toLocaleDateString("en-CA",{timeZone:TZ});
const todayKey = () => dayKey(Date.now());
const fmtDT = iso => iso ? new Date(iso).toLocaleString("en-GB",{timeZone:TZ,day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const fmtT = iso => iso ? new Date(iso).toLocaleTimeString("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}) : "";
const fmtDay = k => new Date(k+"T12:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const pad = (n,w=4) => String(n).padStart(w,"0");
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/[^a-zA-Z0-9-]/g,"");
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); }
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+":"+pin);
  try { const buf = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch { let h=2166136261; for (const b of data){ h^=b; h=Math.imul(h,16777619)>>>0; } return "f"+h.toString(16); }
}
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></svg>',
  cam:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>'
};

/* ---------- image compression ---------- */
function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Could not read that image")); }; img.src = url; });
}
async function compress(img, maxDim, maxChars, q0=0.78){
  let dim = maxDim, q = q0, out = "";
  for (let i=0;i<14;i++){
    const s = Math.min(1, dim / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth*s)), h = Math.max(1, Math.round(img.naturalHeight*s));
    const c = document.createElement("canvas"); c.width=w; c.height=h;
    const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
    out = c.toDataURL("image/jpeg", q);
    if (out.length <= maxChars) return out;
    if (q > 0.5) q -= 0.1; else dim = Math.round(dim*0.82);
  }
  return out;
}

/* ---------- state ---------- */
const S = {
  db:null, ready:false, loadErr:null, canWrite:true,
  loaded:{companies:false,users:false,areas:false,permits:false},
  companies:[], users:[], areas:[], permits:[], permitsById:{}, pubCompanies:[], needsSetup:false, since:0, v:0, meObj:null, isAGC:false,
  token:null, view:"home", areaId:null, adminTab:"approvals", authTab:"login",
  form:{}, filt:{q:"",area:"",company:"",status:"",day:"",type:""}, dayPick:null, placing:null,
  fails:0, lockUntil:0
};
try { S.token = localStorage.getItem("spr_token"); } catch {}
function setToken(t){ S.token=t; try{ t ? localStorage.setItem("spr_token",t) : localStorage.removeItem("spr_token"); }catch{} }
async function api(path, body){
  const r = await fetch(path, {method: body?"POST":"GET", headers: {"content-type":"application/json", ...(S.token?{authorization:"Bearer "+S.token}:{})}, body: body?JSON.stringify(body):undefined});
  let d={}; try{ d = await r.json(); }catch{}
  if (r.status===401 && S.token && path!=="/api/login"){ signOut(true); }
  if (!r.ok) throw new Error(d.error || ("Request failed ("+r.status+")"));
  return d;
}
const photoUrl = (serial, kind) => "/api/photo/"+encodeURIComponent(serial)+"?t="+encodeURIComponent(S.token||"")+(kind?"&kind="+kind:"")+"&v="+(S.permitsById[serial]?.photoAt||"");
function signOut(silent){ if(S.token && !silent) api("/api/logout",{}).catch(()=>{}); setToken(null); S.meObj=null; S.isAGC=false; S.ready=true; S.view="home"; S.form={}; S.users=[]; S.permits=[]; S.permitsById={}; S.since=0; S.v=0; closeModal(); boot(); }
const me = () => S.meObj;
const companyOf = id => S.companies.find(c => c.id === id) || null;
const areaOf = id => S.areas.find(a => a.id === id) || null;
const userName = id => (S.users.find(u=>u.id===id)||{}).name || "Unknown";
function isAGC(){ return !!S.isAGC; }

function canCancel(p){ const u=me(); return !!u && p.status!=="cancelled" && (isAGC() || u.companyId===p.companyId); }
const sortedAreas = () => [...S.areas].sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));

function writeErr(e){ console.error(e); return (e && e.message) || "Something went wrong. Try again."; }
async function busy(btn, fn){
  if (btn.disabled) return; const old=[...btn.childNodes]; btn.disabled=true; btn.replaceChildren(el("span",{class:"spin"}), " Working…");
  try { await fn(); } catch(e){ toast(writeErr(e)); } finally { if (btn.isConnected){ btn.disabled=false; btn.replaceChildren(...old); } }
}

/* ---------- render ---------- */
function render(){
  const app = $("#app"); const ae = document.activeElement;
  const keep = ae && ae.id && app.contains(ae) ? {id:ae.id, s:ae.selectionStart, e:ae.selectionEnd} : null;
  app.replaceChildren(rootView());
  if (keep){ const n=document.getElementById(keep.id); if (n){ n.focus(); try{ n.setSelectionRange(keep.s, keep.e); }catch{} } }
}
function bind(key, props={}){
  return el(props.tag||"input", {class:"in-f "+(props.cls||""), id:"f_"+key, value:S.form[key]??"", ...props.attrs,
    oninput:e=>{ S.form[key]=e.target.value; }, onchange:e=>{ S.form[key]=e.target.value; if(props.rerender) render(); }}, props.kids||[]);
}
function rootView(){
  if (!S.ready) return el("div",{class:"auth"}, brandHero(), el("div",{class:"card empty"}, S.loadErr ? S.loadErr : "Loading permit register…", S.loadErr?el("div",{style:"margin-top:12px"},el("button",{class:"btn primary",onclick:()=>{S.loadErr=null;render();boot();}},"Try again")):null));

function openCancel(p){

    toast(p.serial+" cancelled"); closeModal();

/* ---------- my account ---------- */

  if (S.form.myname==null) S.form.myname=u.name;

    el("div",{class:"card"}, el("h2",null,"Account name"), el("label",{class:"f"}, el("span",null,"Name (used to sign in)"), bind("myname")), nbtn),
    el("div",{class:"card"}, el("h2",null,"Change PIN"),

    el("button",{class:"btn ghost big",onclick:()=>signOut()},"Sign out"));

/* ---------- AGC admin ---------- */
function adminView(){
  const t=S.adminTab; const pending=S.users.filter(u=>u.status==="pending").length;
  const tb=(id,l)=>el("button",{class:t===id?"on":"",onclick:()=>{S.adminTab=id;S.placing=null;render();}},l);
  let body = t==="users"?adminUsers(): t==="companies"?adminCompanies(): t==="areas"?adminAreas(): adminApprovals();
  return el("div",null, el("h1",null,"AGC Admin"), el("div",{class:"tabs"}, tb("approvals","Approvals"+(pending?` (${pending})`:"")), tb("users","Users"), tb("companies","Companies"), tb("areas","Areas & map")), body);
}
async function setUser(u, patch, msg){ await api("/api/users/"+u.id+"/status",{status:patch.status}); await refresh(); if(msg) toast(msg); }
function adminApprovals(){
  const list = S.users.filter(u=>u.status==="pending").sort((a,b)=>String(a.createdAt).localeCompare(b.createdAt));
  if (!list.length) return el("div",{class:"card empty"},"No accounts waiting for approval.");
  return el("div",{class:"card"}, list.map(u=>{ const c=companyOf(u.companyId);
    const ok=el("button",{class:"btn primary small",onclick:()=>busy(ok,()=>setUser(u,{status:"approved",approvedBy:me().id,approvedAt:new Date().toISOString()},u.name+" approved"))},"Approve");
    const no=el("button",{class:"btn ghost small",onclick:()=>busy(no,()=>setUser(u,{status:"rejected",approvedBy:me().id,approvedAt:new Date().toISOString()},u.name+" rejected"))},"Reject");
    return el("div",{class:"listrow"}, el("div",{class:"grow"}, el("b",null,u.name), el("div",{class:"muted",style:"font-size:13px"}, c?c.name:"Unknown company", c&&c.type!=="main"?" · "+(c.type==="subcontractor"?"Subcontractor":"Contractor"):" · AGC staff", " · requested ", fmtDT(u.createdAt))), ok, no); }));
}
function adminUsers(){
  const list = S.users.filter(u=>u.status!=="pending").sort((a,b)=>a.name.localeCompare(b.name));
  return el("div",{class:"card"}, list.length? list.map(u=>{ const c=companyOf(u.companyId); const self=u.id===me().id;
    const n=S.permits.filter(p=>p.createdBy===u.id).length;
    const tog = u.status==="approved"
      ? el("button",{class:"btn ghost small",disabled:self,onclick:()=>busy(tog,()=>setUser(u,{status:"suspended"},u.name+" suspended"))},"Suspend")
      : el("button",{class:"btn primary small",onclick:()=>busy(tog,()=>setUser(u,{status:"approved",approvedBy:me().id,approvedAt:new Date().toISOString()},u.name+" re-activated"))},"Activate");
    return el("div",{class:"listrow"}, el("div",{class:"grow"}, el("b",null,u.name), " ", statusChip(u.status), el("div",{class:"muted",style:"font-size:13px"}, c?c.name:"", " · ", n, " permits")),
      el("button",{class:"btn ghost small",onclick:()=>openResetPin(u)},"Reset PIN"), tog); }) : el("div",{class:"empty"},"No users yet."));
}
function openResetPin(u){
  const a=el("input",{class:"in-f pinbox",type:"password",inputMode:"numeric",maxLength:6}), b=el("input",{class:"in-f pinbox",type:"password",inputMode:"numeric",maxLength:6});
  const btn=el("button",{class:"btn primary big",onclick:()=>busy(btn,async()=>{
    if(!/^\d{4,6}$/.test(a.value)) throw new Error("PIN must be 4–6 digits"); if(a.value!==b.value) throw new Error("PINs don't match");
    await api("/api/users/"+u.id+"/pin",{pin:a.value}); toast("PIN reset for "+u.name); closeModal(); })},"Set new PIN");
  openModal("Reset PIN · "+u.name, el("p",{class:"muted"},"Give the new PIN to the person directly."), el("label",{class:"f"},el("span",null,"New PIN"),a), el("label",{class:"f"},el("span",null,"Repeat PIN"),b), btn);
}
function adminCompanies(){
  const list=[...S.companies].sort((a,b)=>(a.type==="main"?-1:b.type==="main"?1:a.name.localeCompare(b.name)));
  return el("div",null,
    el("button",{class:"btn primary",style:"margin-bottom:12px",onclick:openAddCompany},"+ Add contractor / subcontractor"),
    el("div",{class:"card"}, list.map(c=>{ const parent=c.parentId&&companyOf(c.parentId); const users=S.users.filter(u=>u.companyId===c.id&&u.status==="approved").length;
      const tog = c.type==="main" ? null : el("button",{class:"btn ghost small",onclick:()=>busy(tog,async()=>{ await api("/api/companies/"+c.id+"/active",{active:c.active===false}); await refresh(); toast(c.name+(c.active===false?" enabled":" disabled")); })}, c.active===false?"Enable":"Disable");
      return el("div",{class:"listrow"}, el("div",{class:"grow"}, el("b",null,c.name), c.active===false?el("span",{class:"status st-suspended",style:"margin-left:6px"},"Disabled"):null,
        el("div",{class:"muted",style:"font-size:13px"}, c.type==="main"?"Main contractor":c.type==="subcontractor"?"Subcontractor":"Contractor", parent?" of "+parent.name:"", " · ", users, " active users · ", S.permits.filter(p=>p.companyId===c.id).length, " permits")), tog); })));
}
function openAddCompany(){
  const name=el("input",{class:"in-f",placeholder:"e.g. MBC"});
  const parent=el("select",{class:"in-f"}, el("option",{value:""},"— none —"), S.companies.filter(c=>c.type!=="subcontractor").map(c=>el("option",{value:c.id},c.name)));
  const pwrap=el("label",{class:"f hidden"},el("span",null,"Works under (contractor)"),parent);
  const type=el("select",{class:"in-f",onchange:()=>pwrap.classList.toggle("hidden",type.value!=="subcontractor")}, el("option",{value:"contractor"},"Contractor"), el("option",{value:"subcontractor"},"Subcontractor"));
  const btn=el("button",{class:"btn primary big",onclick:()=>busy(btn,async()=>{
    const n=name.value.trim(); if(n.length<2) throw new Error("Enter the company name");
    if (S.companies.some(c=>normName(c.name)===normName(n))) throw new Error("That company already exists");
    await api("/api/companies",{name:n,type:type.value,parentId:parent.value||null}); await refresh();
    toast(n+" added — their staff can now create accounts"); closeModal(); })},"Add company");
  openModal("Add company", el("label",{class:"f"},el("span",null,"Company name"),name), el("label",{class:"f"},el("span",null,"Type"),type), pwrap,
    el("p",{class:"muted",style:"font-size:13px"},"After adding, staff of this company can sign up. Each account still needs your approval."), btn);
}
function adminAreas(){
  const areas=sortedAreas();
  return el("div",null,
    el("p",{class:"muted",style:"margin-top:0;font-size:13px"},"Areas on the site map: LINK3, IC4, LINK4, LINK5, IC6, LINK6, IC7, LINK7, IC8, LINK8. Extra areas you add here appear as tiles under the map."),
    el("div",{class:"row",style:"margin-bottom:12px"}, el("button",{class:"btn primary",onclick:()=>openAreaForm()},"+ Add area")),
    el("div",{class:"card"}, areas.length? areas.map(a=>{ const n=S.permits.filter(p=>p.areaId===a.id).length;
      return el("div",{class:"listrow"}, el("div",{class:"grow"}, el("b",{class:"mono"},a.code), " ", el("span",{class:"muted"},a.name||""), el("div",{class:"muted",style:"font-size:13px"}, n," permits · next serial ", a.code+"-"+pad((counterGuess(a))+1))),
        el("button",{class:"btn ghost small",onclick:()=>openAreaForm(a)},"Edit")); }) : el("div",{class:"empty"},"No areas yet.")));
}
const counterGuess = a => Math.max(0,...S.permits.filter(p=>p.areaId===a.id).map(p=>p.seq||0));

  const btn=el("button",{class:"btn primary big",onclick:()=>busy(btn,async()=>{
    if (a){ await api("/api/areas/"+a.id,{name:name.value.trim()}); await refresh(); toast("Area updated"); closeModal(); return; }
    const c=code.value.trim().toUpperCase().replace(/\s+/g,"");
    if(!/^[A-Z0-9][A-Z0-9-]{0,15}$/.test(c)) throw new Error("Use letters, numbers and dashes only (e.g. IC61)");
    if (S.areas.some(x=>String(x.code).toUpperCase()===c)) throw new Error("That area code already exists");

    toast(c+" added — now place it on the map"); closeModal(); })}, a?"Save":"Add area");
  openModal(a?"Edit "+a.code:"Add area", el("label",{class:"f"},el("span",null,"Area code (used in the serial number)"),code),
    a?el("p",{class:"muted",style:"font-size:13px;margin-top:-6px"},"The code can't change once created, so serial numbers stay consistent."):null,
    el("label",{class:"f"},el("span",null,"Description (optional)"),name), btn);
}

/* ---------- boot ---------- */
async function refresh(){
  const d = await api("/api/data?since="+S.since);
  S.v=d.v; S.meObj=d.me; S.isAGC=d.isAGC; S.companies=d.companies; S.users=d.users; S.areas=d.areas;
  for (const p of d.permits){ S.permitsById[p.id]=p; if (p.updatedAt>S.since) S.since=p.updatedAt; }
  S.permits=Object.values(S.permitsById).sort((a,b)=>String(b.createdAt).localeCompare(a.createdAt));
  S.dataReady=true; render();
}
async function boot(){
  try {
    const pub = await api("/api/public"); S.pubCompanies=pub.companies; S.needsSetup=pub.needsSetup;
    if (S.token){ S.meObj = await api("/api/me"); if (S.meObj && S.meObj.status==="approved") await refresh(); }
    S.ready=true; S.loadErr=null; render();
  } catch(e){ if (!S.ready){ S.loadErr="Can't reach the server. Check your internet connection."; } render(); }
}
setInterval(async()=>{
  if (!S.token || !S.meObj || document.hidden) return;
  try { if (S.meObj.status!=="approved"){ S.meObj=await api("/api/me"); if(S.meObj.status==="approved") await refresh(); else return; }
    const {v} = await api("/api/version"); if (v!==S.v) await refresh(); } catch {}
}, 15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.token && S.meObj && S.meObj.status==="approved") api("/api/version").then(r=>{ if(r.v!==S.v) refresh(); }).catch(()=>{}); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
render(); boot();
</script>
